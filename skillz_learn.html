<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skillz Learn AI | Autonomous AI Voice Agents for Business</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
  
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif'],
          },
          animation: {
            'bounce-slow': 'bounce 2.5s infinite',
            'pulse-glow': 'pulseGlow 3s infinite ease-in-out',
            'wave': 'wave 1.2s ease-in-out infinite alternate',
          },
          keyframes: {
            pulseGlow: {
              '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
              '50%': { opacity: '0.8', transform: 'scale(1.05)' },
            },
            wave: {
              '0%': { height: '20%' },
              '100%': { height: '100%' }
            }
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --theme-glow: #e11d48;
      --theme-glow-shadow: rgba(225, 29, 72, 0.5);
      --zen-gradient: linear-gradient(90deg, #e11d48 0%, #a855f7 35%, #38bdf8 70%, #34d399 100%);
      --accent-letter-color: #e11d48;
    }

    body {
      background-color: #04060a;
      color: #ffffff;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      touch-action: manipulation;
    }

    /* Custom Smooth Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #04060a;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    /* Interactive Custom Cursor Follower */
    #cursor-dot {
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 10px;
      height: 10px;
      background-color: var(--theme-glow);
      border-radius: 50%;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, background-color 0.15s ease;
      box-shadow: 0 0 14px var(--theme-glow), 0 0 28px var(--theme-glow);
    }

    #cursor-ring {
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 44px;
      height: 44px;
      border: 1.5px solid var(--theme-glow);
      border-radius: 50%;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: border-color 0.15s ease, transform 0.08s ease-out;
      box-shadow: 0 0 20px var(--theme-glow-shadow);
    }

    /* Highlighted Letters Glow Effect */
    .glow-accent-letter {
      color: var(--accent-letter-color);
      text-shadow: 0 0 18px var(--theme-glow-shadow);
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    /* Dynamic Brand Title Gradient */
    .zenvoice-gradient-text {
      background: var(--zen-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 8px 32px var(--theme-glow-shadow));
      transition: filter 0.2s ease;
    }

    /* Frosted Glass Aesthetics */
    .nav-glass {
      background: rgba(6, 10, 18, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .card-glass {
      background: rgba(10, 15, 26, 0.65);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* 3D Fullscreen WebGL Canvas Container */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Click Wave Ripple Effect */
    .click-ripple {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      border: 2px solid var(--theme-glow);
      box-shadow: 0 0 35px var(--theme-glow);
      animation: rippleAnim 0.65s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      z-index: 9997;
      transform: translate(-50%, -50%);
    }

    @keyframes rippleAnim {
      0% { width: 10px; height: 10px; opacity: 1; }
      100% { width: 340px; height: 340px; opacity: 0; }
    }
  </style>
</head>
<body class="relative min-h-screen bg-[#04060a] text-white antialiased selection:bg-rose-500 selection:text-white overflow-x-hidden">

  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <!-- Background Three.js Infinity Ribbon Canvas -->
  <div id="canvas-container"></div>

  <header class="fixed top-5 left-0 right-0 z-50 flex justify-center px-4">
    <nav class="nav-glass rounded-full px-6 py-3 flex items-center justify-between w-full max-w-6xl transition-all duration-300">
      
      <!-- Brand Logo -->
      <a href="#home" class="flex items-center gap-2.5 group">
        <div id="logo-badge" class="w-9 h-9 rounded-full p-[1.5px] flex items-center justify-center shadow-lg transition-transform group-hover:scale-105" style="background: var(--zen-gradient);">
          <div class="w-full h-full bg-[#070b12] rounded-full flex items-center justify-center">
            <!-- Inline SVG Voice Icon -->
            <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 016 0v6a3 3 0 01-3 3z" />
            </svg>
          </div>
        </div>
        <span class="font-display font-bold text-xl tracking-tight text-white flex items-center">
          Skillz<span id="logo-text-accent" class="text-rose-400 transition-colors ml-0.5">Learn</span>
        </span>
      </a>

      <!-- Navigation Links -->
      <div class="hidden md:flex items-center gap-7 text-xs tracking-wider font-semibold uppercase text-zinc-300">
        <a href="#home" class="hover:text-rose-400 transition-colors text-white">Home</a>
        <a href="#features" class="hover:text-rose-400 transition-colors text-zinc-400">Features</a>
        <a href="#faqs" class="hover:text-rose-400 transition-colors text-zinc-400">FAQs</a>
        <a href="#blog" class="hover:text-rose-400 transition-colors text-zinc-400">Blog</a>
        <a href="#pricing" class="hover:text-rose-400 transition-colors text-zinc-400">Pricing</a>
        <a href="#partner" class="hover:text-rose-400 transition-colors text-zinc-400">Partner With Us</a>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-3">
        <div class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-white/5 border border-white/10 text-zinc-300">
          <svg class="w-3.5 h-3.5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" /></svg>
          <span>EN</span>
        </div>

        <button class="relative group overflow-hidden rounded-full p-[1px] focus:outline-none">
          <span class="absolute inset-0 bg-gradient-to-r from-rose-500 via-purple-500 to-cyan-400 rounded-full opacity-80 group-hover:opacity-100 transition-opacity"></span>
          <span class="relative px-5 py-2 rounded-full bg-[#080d16] block text-xs font-bold tracking-wider text-white transition-colors group-hover:bg-opacity-80">
            SIGN IN
          </span>
        </button>
      </div>
    </nav>
  </header>

  <main id="home" class="relative z-10 flex flex-col items-center justify-between min-h-screen pt-44 pb-16 px-4 max-w-7xl mx-auto text-center">
    
    <!-- Hero Main Heading Section -->
    <div class="flex flex-col items-center max-w-5xl mx-auto my-auto">
      
      <!-- Subheading with Highlighted Capital Letters A, Y, B -->
      <h2 class="text-3xl sm:text-5xl md:text-6xl font-extrabold tracking-tight mb-4 font-display text-white">
        <span class="glow-accent-letter">A</span>ccelerate <span class="glow-accent-letter">Y</span>our <span class="glow-accent-letter">B</span>usiness
      </h2>

      <p class="text-xs sm:text-sm font-bold tracking-[0.4em] uppercase text-zinc-300 mb-4">
        WITH
      </p>

      <!-- Main SKILLZ LEARN Title -->
      <h1 id="brand-headline" class="text-6xl sm:text-8xl md:text-[9.5rem] font-black tracking-tighter uppercase font-display mb-10 zenvoice-gradient-text leading-none drop-shadow-2xl">
        SKILLZ LEARN
      </h1>

    </div>

    <!-- Scroll Down Indicator -->
    <div class="flex flex-col items-center gap-2 mt-8 group cursor-pointer">
      <span class="text-[11px] font-bold tracking-[0.3em] uppercase text-zinc-300 group-hover:text-white transition-colors">
        SCROLL ME
      </span>
      <div class="flex flex-col items-center gap-1 text-rose-400 group-hover:translate-y-1 transition-transform">
        <svg class="w-5 h-5 animate-bounce-slow" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </div>
    </div>

  </main>

  <script>
    // Cursor Follower & Interaction Tracking Logic
    const cursorDot = document.getElementById('cursor-dot');
    const cursorRing = document.getElementById('cursor-ring');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let ringX = mouseX;
    let ringY = mouseY;
    
    let isHoveringScreen = false;
    let cursorFactor = 0; // 0 = Pure Infinity Snake, 1 = Pure Cursor Snake Follower
    let mouseIdleTimer = null;

    const mouseNorm = { x: 0, y: 0, targetX: 0, targetY: 0, speed: 0 };
    let prevMouseX = mouseX;
    let prevMouseY = mouseY;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursorDot.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
      
      mouseNorm.targetX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseNorm.targetY = -(e.clientY / window.innerHeight) * 2 + 1;

      const dx = e.clientX - prevMouseX;
      const dy = e.clientY - prevMouseY;
      mouseNorm.speed = Math.min(Math.sqrt(dx * dx + dy * dy) * 0.05, 1.0);
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;

      isHoveringScreen = true;
      clearTimeout(mouseIdleTimer);
      mouseIdleTimer = setTimeout(() => {
        // Smoothly drift back to infinity loop when idle
        // isHoveringScreen = false;
      }, 4000);
    });

    document.addEventListener('mouseleave', () => {
      isHoveringScreen = false;
    });

    document.addEventListener('mouseenter', () => {
      isHoveringScreen = true;
    });

    function updateCursor() {
      ringX += (mouseX - ringX) * 0.2;
      ringY += (mouseY - ringY) * 0.2;
      cursorRing.style.transform = `translate(${ringX}px, ${ringY}px) translate(-50%, -50%)`;
      requestAnimationFrame(updateCursor);
    }
    updateCursor();

    // COLOR PALETTES FOR SPECTRUM CYCLE
    const COLOR_PALETTES = [
      {
        name: "Rose Sunset",
        c1: { r: 0.88, g: 0.11, b: 0.28 }, // #e11d48
        c2: { r: 0.66, g: 0.33, b: 0.97 }, // #a855f7
        c3: { r: 0.22, g: 0.74, b: 0.97 }, // #38bdf8
        gradientCss: "linear-gradient(90deg, #e11d48 0%, #a855f7 40%, #38bdf8 80%, #ffffff 100%)",
        hex1: "#e11d48"
      },
      {
        name: "Cyber Cyan",
        c1: { r: 0.22, g: 0.74, b: 0.97 }, // #38bdf8
        c2: { r: 0.20, g: 0.83, b: 0.60 }, // #34d399
        c3: { r: 0.66, g: 0.33, b: 0.97 }, // #a855f7
        gradientCss: "linear-gradient(90deg, #38bdf8 0%, #34d399 40%, #a855f7 80%, #ffffff 100%)",
        hex1: "#38bdf8"
      },
      {
        name: "Emerald Lime",
        c1: { r: 0.20, g: 0.83, b: 0.60 }, // #34d399
        c2: { r: 0.52, g: 0.88, b: 0.09 }, // #84cc16
        c3: { r: 0.96, g: 0.62, b: 0.04 }, // #f59e0b
        gradientCss: "linear-gradient(90deg, #34d399 0%, #84cc16 45%, #f59e0b 85%, #ffffff 100%)",
        hex1: "#34d399"
      },
      {
        name: "Electric Violet",
        c1: { r: 0.66, g: 0.33, b: 0.97 }, // #a855f7
        c2: { r: 0.93, g: 0.28, b: 0.60 }, // #ec4899
        c3: { r: 0.88, g: 0.11, b: 0.28 }, // #e11d48
        gradientCss: "linear-gradient(90deg, #a855f7 0%, #ec4899 45%, #e11d48 85%, #ffffff 100%)",
        hex1: "#a855f7"
      }
    ];

    let activePaletteIdx = 0;
    let curPalette = COLOR_PALETTES[0];
    let hueCycle = 0;

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x04060a, 0.015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 28;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const infinityGroup = new THREE.Group();
    scene.add(infinityGroup);

    // Dynamic Trail History for Smooth Cursor Snake
    const HISTORY_LENGTH = 160;
    const mouseHistory = [];
    for (let h = 0; h < HISTORY_LENGTH; h++) {
      mouseHistory.push(new THREE.Vector3(0, 0, 0));
    }

    // ULTRA-HIGH DENSITY BUNCH INFINITY SNAKE STRANDS (450 LINES)
    const STRAND_COUNT = 450;
    const SEGMENTS_PER_STRAND = 160;
    const strands = [];

    for (let i = 0; i < STRAND_COUNT; i++) {
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(SEGMENTS_PER_STRAND * 3);
      const colors = new Float32Array(SEGMENTS_PER_STRAND * 3);

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 0.98,
        blending: THREE.AdditiveBlending,
      });

      const line = new THREE.Line(geometry, material);
      infinityGroup.add(line);

      // Multi-layered shell distribution (inner dense core -> outer volumetric aura)
      const layer = i % 3; // 0 = Core, 1 = Dense Body, 2 = Volumetric Halo
      const radiusBase = layer === 0 ? 0.05 + (i % 15) * 0.02 : layer === 1 ? 0.20 + (i % 20) * 0.03 : 0.50 + (i % 25) * 0.025;

      strands.push({
        line,
        radialAngle: (i / STRAND_COUNT) * Math.PI * 2 + (i % 7) * 0.2,
        radialRadius: radiusBase,
        twistRate: 2.8 + (i % 8) * 0.4,
        speedMultiplier: 0.88 + (i % 7) * 0.05,
        phaseOffset: (i / STRAND_COUNT) * 0.5
      });
    }

    function triggerThemeSwitch(clickX, clickY) {
      activePaletteIdx = (activePaletteIdx + 1) % COLOR_PALETTES.length;
      curPalette = COLOR_PALETTES[activePaletteIdx];

      document.documentElement.style.setProperty('--zen-gradient', curPalette.gradientCss);
      document.documentElement.style.setProperty('--theme-glow', curPalette.hex1);
      document.documentElement.style.setProperty('--accent-letter-color', curPalette.hex1);

      if (clickX !== undefined && clickY !== undefined) {
        const ripple = document.createElement('div');
        ripple.className = 'click-ripple';
        ripple.style.left = `${clickX}px`;
        ripple.style.top = `${clickY}px`;
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 700);
      }
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('a') || e.target.closest('button')) return;
      triggerThemeSwitch(e.clientX, e.clientY);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate3D() {
      requestAnimationFrame(animate3D);
      const time = clock.getElapsedTime();

      // Ultra Responsive Zero-Latency Mouse Tracking
      mouseNorm.x += (mouseNorm.targetX - mouseNorm.x) * 0.45;
      mouseNorm.y += (mouseNorm.targetY - mouseNorm.y) * 0.45;

      // Map mouse coordinates to 3D World coordinates at camera Z plane
      const targetWorldX = mouseNorm.x * 15;
      const targetWorldY = mouseNorm.y * 8;

      // Update Mouse Trail History (Snappy Instant Lead)
      const headPos = mouseHistory[0];
      headPos.x += (targetWorldX - headPos.x) * 0.85;
      headPos.y += (targetWorldY - headPos.y) * 0.85;
      headPos.z = Math.sin(time * 3) * 1.5;

      for (let h = HISTORY_LENGTH - 1; h > 0; h--) {
        mouseHistory[h].lerp(mouseHistory[h - 1], 0.65);
      }

      // Instant Mode Transition (Cursor Active vs Infinity Loop)
      const targetFactor = isHoveringScreen ? 1.0 : 0.0;
      cursorFactor += (targetFactor - cursorFactor) * 0.2;

      // 3D Group Parallax
      infinityGroup.rotation.y = (1 - cursorFactor) * (mouseNorm.x * 0.35 + Math.sin(time * 0.3) * 0.05);
      infinityGroup.rotation.x = (1 - cursorFactor) * (-mouseNorm.y * 0.25 + Math.cos(time * 0.2) * 0.04);

      hueCycle += 0.003 + mouseNorm.speed * 0.01;

      // Snake Trail Length along Infinity Loop (in radians)
      const SNAKE_TRAIL_RAD = Math.PI * 1.25; 

      for (let i = 0; i < STRAND_COUNT; i++) {
        const strand = strands[i];
        const posAttr = strand.line.geometry.attributes.position;
        const colorAttr = strand.line.geometry.attributes.color;
        
        const posArray = posAttr.array;
        const colorArray = colorAttr.array;

        // Continuous Head movement around Lemniscate infinity path (Snake Game Flow)
        const infinityHeadT = (time * 1.2 * strand.speedMultiplier + strand.phaseOffset) % (Math.PI * 2);

        for (let j = 0; j < SEGMENTS_PER_STRAND; j++) {
          const segRatio = j / (SEGMENTS_PER_STRAND - 1); // 0.0 at tail, 1.0 at head

          // 1. Calculate Infinity Snake Loop position (Traveling bundle along Lemniscate)
          const t = infinityHeadT - (1.0 - segRatio) * SNAKE_TRAIL_RAD;
          const denom = 1 + Math.sin(t) * Math.sin(t);
          let bx = (18.0 * Math.cos(t)) / denom;
          let by = (7.5 * Math.sin(t) * Math.cos(t)) / denom;
          let bz = Math.sin(t) * 3.5;

          const twistAngle = t * strand.twistRate + strand.radialAngle + time * 2.0;
          const strandOffX = Math.cos(twistAngle) * strand.radialRadius;
          const strandOffY = Math.sin(twistAngle) * strand.radialRadius;

          const infPx = bx + strandOffX;
          const infPy = by + strandOffY;
          const infPz = bz;

          // 2. Calculate Cursor Snake Follower position (Bundle trailing cursor position)
          const histIdx = Math.floor((1.0 - segRatio) * (HISTORY_LENGTH - 1));
          const histPos = mouseHistory[Math.min(histIdx, HISTORY_LENGTH - 1)];

          const curTwist = segRatio * 8.0 + strand.radialAngle + time * 3.0;
          const curOffX = Math.cos(curTwist) * (strand.radialRadius * 1.2);
          const curOffY = Math.sin(curTwist) * (strand.radialRadius * 1.2);

          const curPx = histPos.x + curOffX;
          const curPy = histPos.y + curOffY;
          const curPz = histPos.z + Math.cos(curTwist) * 0.5;

          // 3. Blend smoothly between Infinity Loop Snake & Cursor Snake Follower
          const px = THREE.MathUtils.lerp(infPx, curPx, cursorFactor);
          const py = THREE.MathUtils.lerp(infPy, curPy, cursorFactor);
          const pz = THREE.MathUtils.lerp(infPz, curPz, cursorFactor);

          posArray[j * 3] = px;
          posArray[j * 3 + 1] = py;
          posArray[j * 3 + 2] = pz;

          // Multi-Segment Snake Trains with Gaps ("Konjam gap vitu follow panra mari")
          const NUM_SNAKES = 3; // 3 distinct glowing snake segments
          const cycle = (segRatio * NUM_SNAKES) % 1.0;
          const gapThreshold = 0.68; // 68% glowing snake body, 32% empty gap between segments

          let snakeGlowAlpha = 0.0;
          if (cycle < gapThreshold) {
            const localRatio = cycle / gapThreshold; // 0.0 (tail) to 1.0 (head)
            snakeGlowAlpha = Math.pow(localRatio, 1.6);
          } else {
            snakeGlowAlpha = 0.0; // Empty gap between snake segments!
          }

          const segmentHue = (hueCycle + segRatio * 0.4 + (i / STRAND_COUNT) * 0.2) % 1.0;
          
          const r = (Math.sin(segmentHue * Math.PI * 2) * 0.5 + 0.5) * snakeGlowAlpha;
          const g = (Math.sin((segmentHue + 0.33) * Math.PI * 2) * 0.5 + 0.5) * snakeGlowAlpha;
          const b = (Math.sin((segmentHue + 0.66) * Math.PI * 2) * 0.5 + 0.5) * snakeGlowAlpha;

          const cIdx = j * 3;
          colorArray[cIdx] = r * 0.85 + curPalette.c1.r * 0.15 * snakeGlowAlpha;
          colorArray[cIdx + 1] = g * 0.85 + curPalette.c1.g * 0.15 * snakeGlowAlpha;
          colorArray[cIdx + 2] = b * 0.85 + curPalette.c1.b * 0.15 * snakeGlowAlpha;
        }

        posAttr.needsUpdate = true;
        colorAttr.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    animate3D();
  </script>
</body>
